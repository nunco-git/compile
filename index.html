<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지출결의서 · 증빙 촬영</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--line:#d9dce1;--ink:#1f2937;--sub:#6b7280;--pri:#2563eb;--pri2:#1d4ed8;--danger:#dc2626;--ok:#059669}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:7px}
button:hover{background:#f3f4f6}
button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
button.pri:hover{background:var(--pri2)}
button.dng{color:var(--danger)}
button.sm{padding:3px 8px;font-size:12px}
input,textarea,select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid #bfdbfe;border-color:var(--pri)}
label{display:block;font-size:12px;color:var(--sub);margin:0 0 3px}
.hidden{display:none!important}

/* ===== 앱 화면 ===== */
#app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.topbar h1{font-size:16px;margin:0;flex:1;min-width:140px}
.topbar .stat{font-size:12px;color:var(--sub)}
.wrap{max-width:1280px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:normal;color:var(--sub);font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--sub);font-size:12px}

/* 카메라·모달 */
#cam{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column}
#cam video{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
#cam .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:#111;color:#fff}
#cam .bar button{background:#374151;color:#fff;border:0;padding:12px 18px;font-size:15px}
#cam #shot{width:72px;height:72px;border-radius:50%;background:#fff;border:5px solid #9ca3af;padding:0}
#cam #shot:active{background:#d1d5db}
#cam .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#cam .flash.on{opacity:.75;transition:none}
#cam .cnt{font-size:15px;min-width:70px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:12px;padding:20px;max-width:360px;width:100%;text-align:center}
.modal .box h3{margin:0 0 8px;font-size:16px}
.modal .qr svg{width:240px;height:240px}
.modal .url{font-size:11px;word-break:break-all;color:var(--sub);margin:8px 0 12px;user-select:all}
.dropping{outline:3px dashed var(--pri);outline-offset:-3px;background:#eff6ff}
/* 로그인·배너 */
.banner{font-size:12px;padding:7px 10px;border-radius:8px;margin-bottom:12px}
.banner.loc{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.banner.cld{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.who{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.login{max-width:420px;margin:60px auto;text-align:center}
.login p{color:var(--sub);font-size:13px;line-height:1.6}
.err{color:var(--danger);font-size:12px;margin-top:10px;white-space:pre-wrap}
/* 목록 */
.listhead{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.listhead .fac{flex:1;min-width:180px;max-width:320px}
.dl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dl th,.dl td{padding:9px 8px;border-bottom:1px solid #eceef1;text-align:left;font-size:13px}
.dl th{background:#f9fafb;color:var(--sub);font-weight:600;font-size:12px}
.dl tr.item{cursor:pointer}.dl tr.item:hover{background:#f8fafc}
.dl td.r{text-align:right}
.empty{padding:40px;text-align:center;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:10px}

/* 편집 */
.edit{display:grid;grid-template-columns:minmax(380px,520px) 1fr;gap:14px;align-items:start}
.pvbox{position:sticky;top:62px;max-height:calc(100vh - 76px);overflow:auto;background:#6b7280;border-radius:10px;padding:12px}
.pvwrap{margin:0 auto 12px;box-shadow:0 2px 10px rgba(0,0,0,.35);background:#fff;overflow:hidden}
.pvwrap>.page{transform-origin:top left}
.tabs{display:none}

.items-row{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:#fafbfc}
.items-row .top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.items-row .no{font-size:12px;color:var(--sub);width:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fafbfc}
.chip input{width:80px;padding:4px 6px;text-align:center}
.chip button{padding:2px 6px;font-size:12px;border:0;background:transparent}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.ph{border:1px solid var(--line);border-radius:8px;padding:5px;background:#fafbfc}
.ph img{width:100%;height:120px;object-fit:contain;background:#eee;border-radius:5px;display:block}
.ph .bt{display:flex;gap:3px;flex-wrap:wrap;margin:5px 0}
.ph .bt button{padding:2px 6px;font-size:11px}
.ph input{padding:4px 6px;font-size:12px}
.radio{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.radio label{display:flex;align-items:center;gap:5px;color:var(--ink);font-size:13px;margin:0}
.radio input{width:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}

@media(max-width:900px){
  .edit{grid-template-columns:1fr}
  .pvbox{position:static;max-height:none}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1}
  .tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
  .edit.tab-form .pvbox{display:none}
  .edit.tab-prev .formcol{display:none}
  .g3,.g4{grid-template-columns:1fr 1fr}
  input,textarea,select{font-size:16px}
  .big-btn{padding:12px 16px;font-size:15px}
}

/* ===== 인쇄용 지출결의서 페이지 (미리보기와 동일) ===== */
.page{width:210mm;height:297mm;padding:15mm 15mm 11mm;background:#fff;color:#000;overflow:hidden;
  font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR','Noto Sans CJK KR',sans-serif;font-size:10pt}
.pg-in{height:100%;display:flex;flex-direction:column}
.pg-in .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8mm;min-height:27mm}
.pg-in .title{flex:1;text-align:center;font-size:24pt;font-weight:500;letter-spacing:1mm;padding-top:8mm;white-space:nowrap}
.pg-in .appr{display:flex;border:1px solid #000;flex:none}
.pg-in .appr .lab{width:7mm;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:9pt;writing-mode:vertical-rl;letter-spacing:2mm}
.pg-in .appr .col{width:18mm;border-right:1px solid #000}
.pg-in .appr .col:last-child{border-right:0}
.pg-in .appr .col .n{height:6.5mm;border-bottom:1px solid #000;text-align:center;font-size:9pt;line-height:6.5mm;overflow:hidden;white-space:nowrap}
.pg-in .appr .col .s{height:17mm;display:flex;align-items:center;justify-content:center}
.pg-in .appr .col .s img.stamp{max-width:15mm;max-height:15mm;object-fit:contain}
.pg-in table{border-collapse:collapse;width:100%;table-layout:fixed}
.pg-in td,.pg-in th{border:1px solid #000;height:8.4mm;padding:0 1.5mm;text-align:center;font-weight:normal;font-size:9.5pt;overflow:hidden;white-space:nowrap}
.pg-in th{white-space:pre}
.pg-in td.l{text-align:left}
.pg-in td.rt{text-align:right;padding-right:2.5mm}
.pg-in .t1 .big{font-size:10.5pt}
.pg-in .t2{margin-top:-1px}
.pg-in .t2 th{height:8.4mm}
.pg-in .t2 td{white-space:normal;word-break:break-all;line-height:1.25;padding-top:.5mm;padding-bottom:.5mm}
.pg-in .box{display:flex;border:1px solid #000;border-top:0}
.pg-in .box .lb{width:14.2%;border-right:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:9.5pt;flex:none}
.pg-in .sum{height:11.5mm}
.pg-in .sum .vl{flex:1;display:flex;align-items:center;justify-content:center;font-size:10pt}
.pg-in .remark{flex:1;min-height:30mm}
.pg-in .remark .vl{flex:1;min-width:0;padding:2.5mm;display:flex;flex-direction:column}
.pg-in .rtext{white-space:pre-wrap;font-size:9.5pt;line-height:1.4;margin-bottom:2mm}
.pg-in .evgrid{flex:1;min-height:0;display:grid;gap:0}
.pg-in .ev{display:flex;flex-direction:column;min-height:0;min-width:0}
.pg-in .ev .iw{flex:1;min-height:0;position:relative}
.pg-in .ev .iw img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center center}
.pg-in .ev{position:relative}
.rotbtns{display:none}
#blPv .rotbtns{display:flex;gap:3px;position:absolute;top:3px;right:3px;z-index:3}
#blPv .rotbtns button{background:rgba(0,0,0,.65);color:#fff;border:0;border-radius:4px;width:26px;height:26px;font-size:16px;line-height:1;cursor:pointer;padding:0}
#blPv .rotbtns button:hover{background:#2563eb}
.pg-in .ev .cap{font-size:8pt;text-align:left;line-height:1.3;padding-bottom:.8mm;color:#222}
.pg-in .foot{font-size:8.5pt;margin-top:2.5mm;padding-left:1mm;display:flex;justify-content:space-between;gap:6mm}
.pg-in .evhead{display:flex;justify-content:space-between;border-bottom:1px solid #000;padding-bottom:2mm;margin-bottom:4mm;font-size:11pt}
.pg-in .evhead b{font-size:13pt}
.pg-in .blankbody{flex:1;display:flex;align-items:center;justify-content:center;border:1.5px solid #000;margin-bottom:4mm}
.pg-in .evgrid.evbox{border-top:1px solid #000;border-left:1px solid #000;margin-bottom:4mm}
.pg-in .evgrid.evbox>.ev{border-right:1px solid #000;border-bottom:1px solid #000;padding:1.5mm}
.pg-in .remark .evgrid.evbox{margin-bottom:0}
.pg-in .blankbody .hint{color:#c8c8c8;font-size:10pt}
@media print{.pg-in .blankbody .hint{visibility:hidden}}

/* ===== 인쇄 ===== */
#printRoot{display:none}
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff}
  #app,.toast{display:none!important}
  #printRoot{display:block}
  #printRoot .page{page-break-after:always;break-after:page}
  #printRoot .page:last-child{page-break-after:auto;break-after:auto}
}

.prof .muted{line-height:1.7}
.prof.edit{border-color:var(--pri,#2b6cb0);background:#f7fbff}
.acstat{font-size:12.5px;padding:7px 10px;border-radius:7px;margin:0 0 8px;background:#eef6ee;border:1px solid #cfe5cf;color:#235a23;line-height:1.5}
.acstat.warn{background:#fff6e5;border-color:#f0d9a8;color:#7a5200}
.acstat.info{background:#f1f4f8;border-color:#dbe2ea;color:#445}
.ocrbar{font-size:12.5px;padding:7px 10px;border-radius:7px;margin-top:8px;background:#f1f4f8;border:1px solid #dbe2ea;color:#334;line-height:1.5;display:none}
.ocrbar.on{display:block}.ocrbar.ok{background:#eef6ee;border-color:#cfe5cf;color:#235a23}.ocrbar.bad{background:#fff1f0;border-color:#f3c6c2;color:#8a2a22}
.items-row .src{font-size:12px}
.facline{margin-top:10px;font-size:12.5px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#e8f0fe;color:#1a4fa0;margin-right:4px}.tag.in{background:#e6f4ea;color:#17692d}
.bk table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}.bk th,.bk td{border-bottom:1px solid #e3e7ec;padding:4px 6px;text-align:left}.bk td.r{text-align:right}.bk .scroll{max-height:46vh;overflow:auto}

.bkp .bk-ref{font-size:8.5pt;margin-bottom:2mm}
.bkp .bk-title{text-align:center;font-size:17pt;letter-spacing:1.5mm;text-decoration:underline;margin:1mm 0 5mm}
.bkp .bk-sub{text-align:center;font-size:10pt;margin:-2mm 0 4mm}
.bkp .bk-acct{font-size:10pt;margin-bottom:2mm}
.bkp table.bk th,.bkp table.bk td{height:6.6mm;font-size:8.6pt;white-space:normal;word-break:break-all;line-height:1.2;padding:.4mm 1.2mm}
.bkp table.bk th{height:8mm}
.bkp .tot td{font-weight:bold}
.bkp .empty{text-align:center;padding:30mm 0;font-size:10pt}
a.lk{color:#1a56c4;text-decoration:underline;cursor:pointer}
tr.hl td{background:#fff3b0!important}
.bkp input.bud{width:100%;border:1px dashed #8aa;padding:1px 3px;font-size:8.6pt;text-align:right;background:#fffef5;box-sizing:border-box}
.bkp input.bud.tx{text-align:left}
.bktabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bktabs button.on{background:#2b6cb0;color:#fff;border-color:#2b6cb0}
@media print{a.lk{color:#000;text-decoration:none}tr.hl td{background:none!important}.bkp input.bud{border:0;background:none}}
.rb{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.rb .rbl{font-size:12px;color:var(--sub);width:54px}
.rb .rbo{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:18px;padding:4px 12px;cursor:pointer;background:#fff;font-size:13.5px;margin:0}
.rb .rbo input{width:auto;margin:0}
.pg-in .ev.empty{display:flex;align-items:center;justify-content:center;color:#888;font-size:11pt;letter-spacing:1px}
.rb1{flex-wrap:nowrap;gap:10px;justify-content:space-between;padding:0 8px}.rb1 .rbg{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}.rb1 .rbl{width:auto;font-size:12px}.rb1 .rbo{padding:3px 7px;font-size:12px;gap:0}.rb1 .rbo input{display:none}
.rb .rbo:has(input:checked){background:#e7f0ff;border-color:#2563eb;color:#1d4ed8;font-weight:bold}
@media(max-width:1150px){.rb1{flex-wrap:wrap}}
@media(max-width:900px){.bl2{grid-template-columns:1fr!important}}
details.more{margin-top:10px}details.more summary{cursor:pointer;font-size:12.5px;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<div id="printRoot"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileGal" accept="image/*,application/pdf,.pdf" multiple class="hidden">
<input type="file" id="fileBank" accept=".xlsx,.xls,.csv" class="hidden">
<input type="file" id="fileImp" accept=".json,application/json" class="hidden">

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;

        var b0 = bin.read();

        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

  /* 증빙 원본 1개를 연도/월/결의서번호/ 폴더에 저장 (허용이 없으면 대기열에 보관) */
  async add(d,file){
    if(!this.h)return;
    d.fseq=(d.fseq||0)+1;
    const j={year:(d.year||(d.date||'').slice(0,4)||'연도미정')+'년',mon:((d.date||'').slice(5,7)||'00')+'월',no:d.no||'번호없음',file,name:''};
    j.name=this.safe(d.no)+'_'+String(d.fseq).padStart(2,'0')+'_'+this.safe(file.name||'증빙');
    if(await this.perm(true)){try{await this.write(j);return}catch(e){console.error(e)}}
    this.pend.push(j);if(view==='list')renderList();
    toast('폴더 접근 허용이 필요해 '+this.pend.length+'건을 대기시켰습니다. 목록 화면의 [대기 파일 저장]을 눌러 주세요',6000);
  },
  async flush(ask){
    if(!this.pend.length)return;
    if(!(await this.perm(ask))){toast('폴더 접근을 허용해야 저장할 수 있습니다');return}
    let n=0;const rest=[];
    for(const j of this.pend){try{await this.write(j);n++}catch(e){console.error(e);rest.push(j)}}
    this.pend=rest;toast('폴더에 '+n+'건 저장했습니다'+(rest.length?' (실패 '+rest.length+'건)':''));if(view==='list')renderList();
  }
};

function normDoc(d){
  if(d.kind!=='in')d.kind='out';
  if(d.fType===undefined)d.fType=(d.gwan||d.hang||d.mok)?'custom':'';
  ['gwanC','hangC','mokC','hangCustom','mokCustom','manager','head'].forEach(k=>{if(d[k]===undefined)d[k]=''});
  if(d.acctAuto===undefined)d.acctAuto=!d.mok;
  return d;
}
function accList(d){const t=ACC_TYPES.find(x=>x.id===d.fType);return t?t[d.kind==='in'?'in':'out']:null}
function applyAcct(d){
  const list=accList(d);if(!list)return;
  const g=list.find(x=>x[0]===d.gwanC),h=g&&g[2].find(x=>x[0]===d.hangC),m=h&&h[2].find(x=>x[0]===d.mokC);
  d.gwan=g?g[1]:'';

  d.mok=m?m[1].replace(/○○/g,d.mokCustom||'○○'):'';
}
function acctNames(d){
  const list=accList(d);if(!list)return ACCTS;
  const out=[];list.forEach(g=>g[2].forEach(h=>h[2].forEach(m=>{if(!out.includes(m[1]))out.push(m[1])})));

  return out;
}

/* ---------- 이미지 처리 ---------- */
function encodeFit(c,q){
  let cv=c;q=q||0.78;
  for(let t=0;t<10;t++){
    const u=cv.toDataURL('image/jpeg',q);
    if(u.length<=MAX_PHOTO_CHARS)return u;
    if(q>0.55){q-=0.1;continue}
    const n=document.createElement('canvas');n.width=Math.round(cv.width*.85);n.height=Math.round(cv.height*.85);
    n.getContext('2d').drawImage(cv,0,0,n.width,n.height);cv=n;q=0.7;
  }
  return cv.toDataURL('image/jpeg',0.5);
}
async function fileToDataURL(file,maxSide){
  maxSide=maxSide||1400;
  let src,w,h,rel=()=>{};
  try{const bm=await createImageBitmap(file);src=bm;w=bm.width;h=bm.height;rel=()=>bm.close&&bm.close()}
  catch(e){
    const url=URL.createObjectURL(file);
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    src=im;w=im.naturalWidth;h=im.naturalHeight;rel=()=>URL.revokeObjectURL(url);
  }
  const s=Math.min(1,maxSide/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  rel();return encodeFit(c);
}
function loadImg(url){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url})}
async function rotateData(url,ccw){
  const im=await loadImg(url);const c=document.createElement('canvas');c.width=im.naturalHeight;c.height=im.naturalWidth;
  const x=c.getContext('2d');if(ccw){x.translate(0,c.height);x.rotate(-Math.PI/2)}else{x.translate(c.width,0);x.rotate(Math.PI/2)}x.drawImage(im,0,0);
  return encodeFit(c,0.8);
}
async function enhanceData(url){
  const im=await loadImg(url);const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
  const x=c.getContext('2d');x.drawImage(im,0,0);
  const id=x.getImageData(0,0,c.width,c.height),p=id.data,hist=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=p[i+1]=p[i+2]=g;hist[g]++}
  const tot=c.width*c.height;let acc=0,lo=0,hi=255;
  for(let i=0;i<256;i++){acc+=hist[i];if(acc>tot*0.02){lo=i;break}}
  acc=0;for(let i=255;i>=0;i--){acc+=hist[i];if(acc>tot*0.25){hi=i;break}}
  if(hi-lo<30){hi=Math.min(255,lo+30)}
  const lut=new Uint8ClampedArray(256);
  for(let i=0;i<256;i++){let v=(i-lo)/(hi-lo);v=Math.max(0,Math.min(1,v));v=Math.pow(v,1.25);lut[i]=v*255}
  for(let i=0;i<p.length;i+=4){p[i]=p[i+1]=p[i+2]=lut[p[i]]}
  x.putImageData(id,0,0);return encodeFit(c,0.8);
}

async function exportAll(){
  toast('백업 파일 만드는 중…',6000);
  const copy=[];let bad=0;
  for(const d of docs){await Store.hydrate(d);const c=clone(d);
    for(const p of (c.photos||[])){try{p.data=await localData(p.data)}catch(e){bad++;p.data=''}delete p.sp;delete p.op;delete p.on;delete p.v}
    copy.push(c)}
  if(bad)toast('스토리지 사진 '+bad+'장을 백업에 담지 못했습니다 (CORS 설정 필요)',6000);
  const blob=new Blob([JSON.stringify({v:1,settings:S,docs:copy})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='지출결의서_백업_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
$('#fileImp').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.docs))throw 0;
    toast('불러오는 중…',6000);

      for(const p of (d.photos||[])){if(!p.id)p.id=uid();delete p.sp;delete p.op;delete p.on;delete p.v;await Store.savePhoto(d,p)}
      await Store.save(d);const i=docs.findIndex(x=>x.id===d.id);if(i>=0)docs[i]=d;else docs.push(d)}
    if(j.settings){Object.assign(S,j.settings);saveS()}
    toast(j.docs.length+'건 불러왔습니다');renderList();

};

function bizBase(d){return String(d.biz||'').replace(/(사업비|사업)$/,'').trim()}
function autoClassify(d,force){
  if(!force&&d.acctAuto===false)return false;
  if(!ACC_TYPES.some(x=>x.id===d.fType))return false;
  let r=null;
  for(const it of d.items||[]){const t=((it.memo||'')+' '+(it.vendor||'')).trim();if(!t)continue;r=classifyText(t,d.fType,d.bank?d.kind:undefined);if(r)break}
  if(!r){
    if(!force&&d.acctAuto!==false&&d.mok&&(d.items||[]).some(i=>(i.memo||i.vendor||'').trim())){
      const o=d.mok;d.gwanC=d.hangC=d.mokC='';d.hangCustom=d.mokCustom='';applyAcct(d);
      (d.items||[]).forEach(i=>{if(i.acct===o)i.acct=''});
    }
    return false;
  }
  const old=d.mok;
  d.kind=r.kind;d.gwanC=r.gwanC;d.hangC=r.hangC;d.mokC=r.mokC;
  const bb=bizBase(d);d.hangCustom=r.hang.includes('○○')?bb:'';d.mokCustom=r.mok.includes('○○')?bb:'';
  applyAcct(d);d.acctAuto=true;
  (d.items||[]).forEach(i=>{if(!i.acct||i.acct===old)i.acct=d.mok});
  return true;
}
let clsT;
function schedClassify(){
  clearTimeout(clsT);
  clsT=setTimeout(()=>{
    if(!cur)return;const d=cur,prev=d.mok+'|'+d.kind;
    autoClassify(d);
    if(d.mok+'|'+d.kind===prev)return;
    renderGwa();
    document.querySelectorAll('#items .items-row').forEach((row,i)=>{const a=row.querySelector('[data-f=acct]');if(a&&d.items[i])a.value=d.items[i].acct||''});
    touch();refreshPv();
  },500);
}

function mokGroups(d){
  const g={},ord=[];
  (d.items||[]).forEach(it=>{if(!filled(it))return;const k=it.acct||d.mok||'';if(!g[k]){g[k]=[];ord.push(k)}g[k].push(it)});
  return ord.map(k=>({acct:k,items:g[k]}));
}
const isMixed=d=>mokGroups(d).length>1;
function setMokByName(d,name){
  const L=locateMok(d,name);
  if(L){d.gwanC=L.g;d.hangC=L.h;d.mokC=L.m;d.hangCustom=d.mokCustom='';applyAcct(d)}
  else{d.mokC=''}
  if(!L||d.mok!==name){d.mok=name}
  d.acctAuto=false;
}
async function splitByMok(d){
  const G=mokGroups(d);if(G.length<2)return 0;
  const keep=G.find(x=>x.acct===d.mok)||G[0];let made=0;
  for(const grp of G){
    if(grp===keep)continue;
    const c=clone(d);c.id=uid();c.photos=[];c.items=grp.items.map(clone);c.no=autoNo(c.date);c.autoNo=true;c.updated=Date.now();
    setMokByName(c,grp.acct);c.items.forEach(i=>{i.acct=grp.acct});
    docs.push(c);await Store.save(c);made++;
  }
  const moved=new Set(G.filter(x=>x!==keep).flatMap(x=>x.items));
  d.items=(d.items||[]).filter(i=>!moved.has(i));
  d.updated=Date.now();await Store.save(d);return made;
}

const BK_TABS=[['led','총계정원장'],['cash','현금출납부'],['rin','세입결산서'],['rout','세출결산서'],['b1','세입·세출명세서(예산)'],['sbiz','사업수입명세서'],['sgov','정부보조금명세서'],['spay','인건비명세서'],['sprj','사업비명세서'],['sexp','비용명세서']];

function locateMok(d,name){
  const list=accList(d);if(!list)return null;
  for(const g of list)for(const h of g[2])for(const m of h[2]){
    let ok=m[1]===name;
    if(!ok&&m[1].includes('○○')){const rx=new RegExp('^'+m[1].split('○○').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('.*')+'$');ok=rx.test(name)}
    if(ok)return {g:g[0],gn:g[1],h:h[0],hn:h[1],m:m[0]};
  }
  return null;
}
function booksTx(year,full){
  const out=[];
  docs.filter(d=>String(d.year)===String(year)).forEach(d=>{
    normDoc(d);
    (d.items||[]).forEach((it,i)=>{
      if(!filled(it))return;const amt=num(it.amt);if(!amt)return;
      const name=it.acct||d.mok||'(과목 미정)';
      const L=locateMok(d,name);
      out.push({docId:d.id,no:d.no,date:d.date,kind:d.kind,ft:d.fType,acct:name,
        gn:L?L.gn:(d.gwan||''),hn:L?L.hn:(d.hang||''),gc:L?L.g:(d.gwanC||''),hc:L?L.h:(d.hangC||''),mc:L?L.m:((name===d.mok&&d.mokC)||''),
        memo:it.memo||'',vendor:it.vendor||'',fund:it.fund||'',amt,row:i});
    });
  });
  const c=(a,b)=>String(a).localeCompare(String(b),'ko',{numeric:true});
  const r=out.sort((a,b)=>c(a.date,b.date)||c(a.no,b.no)||a.row-b.row);
  return (full||!BK.per)?r:r.filter(t=>+t.date.slice(5,7)===+BK.per);

function docBooks(d){

  if(!T.length)return out;
  out.push({tab:'cash',label:'현금출납부 '+(+d.date.slice(5,7))+'월',month:+d.date.slice(5,7)});
  [...new Set(T.map(t=>t.kind+'|'+t.acct))].forEach(k=>out.push({tab:'led',label:'총계정원장 · '+k.split('|')[1],acct:k}));
  out.push({tab:d.kind==='in'?'rin':'rout',label:d.kind==='in'?'세입결산서':'세출결산서'});
  if(T.some(isBizIn))out.push({tab:'sbiz',label:'사업수입명세서'});
  if(T.some(isGov))out.push({tab:'sgov',label:'정부보조금명세서'});
  if(T.some(t=>t.kind==='out'&&isHr(t)))out.push({tab:'spay',label:'인건비명세서'});
  if(T.some(t=>t.kind==='out'&&isPrj(t)))out.push({tab:'sprj',label:'사업비명세서'});
  [...new Set(T.filter(t=>t.kind==='out'&&!isHr(t)&&!isPrj(t)).map(t=>t.hn||t.acct))].forEach(n=>out.push({tab:'sexp',label:'비용명세서 · '+n,exp:n}));
  return out;
}

async function readSheetRows(file){
  if(!window.XLSX)await OCR.script(OCR.XLSX);
  const buf=await file.arrayBuffer();
  let wb;
  if(/\.csv$/i.test(file.name||'')){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){t=new TextDecoder('euc-kr').decode(buf)}
    wb=window.XLSX.read(t,{type:'string'});
  }else wb=window.XLSX.read(buf,{type:'array'});
  const all=[];
  for(const n of wb.SheetNames)all.push(window.XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}));
  return all;
}

/* ---------- 증빙 자동 인식 (OCR) : 브라우저 안에서 처리, 사진은 서버로 보내지 않습니다 ---------- */
const OCR={
  q:Promise.resolve(),worker:null,loading:null,
  SRC:'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  LANG:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/kor@1.0.0/4.0.0',
  XLSX:'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  PDF:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js',
  PDFW:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js',
  script(src){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=()=>no(new Error('라이브러리를 불러오지 못했습니다 ('+src.split('/')[2]+')'));document.head.appendChild(e)})},
  async init(){
    if(this.worker)return this.worker;
    if(!this.loading)this.loading=(async()=>{
      
      if(!window.Tesseract)await this.script(this.SRC);
      ocrMsg('자동 인식 준비 중… (처음 한 번 한글 인식 데이터 약 7MB를 내려받습니다)');
      const w=await window.Tesseract.createWorker('kor',1,Object.assign({langPath:this.LANG,gzip:true},this.EXTRA||{}));
      this.worker=w;return w;
    })().catch(e=>{this.loading=null;throw e});
    return this.loading;
  },
  async read(canvas){const w=await this.init();const r=await w.recognize(canvas);return r.data.text||''},
  job(fn){const p=this.q.then(fn);this.q=p.catch(()=>{});return p}
};
function ocrMsg(t,cls){const b=$('#ocrBar');if(!b)return;b.textContent=t;b.className='ocrbar on'+(cls?' '+cls:'')}
async function ocrPrep(url){
  const im=await loadImg(url);
  const long=Math.max(im.width,im.height),sc=long<1600?1600/long:(long>2600?2600/long:1);
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  const id=x.getImageData(0,0,c.width,c.height),p=id.data,h=new Uint32Array(256);
  for(let i=0;i<p.length;i+=4){const g=(p[i]*299+p[i+1]*587+p[i+2]*114)/1000|0;p[i]=p[i+1]=p[i+2]=g;h[g]++}
  const tot=c.width*c.height;let lo=0,hi=255,a=0;
  for(;lo<255;lo++){a+=h[lo];if(a>tot*0.01)break}a=0;for(;hi>0;hi--){a+=h[hi];if(a>tot*0.01)break}
  const rg=Math.max(40,hi-lo);
  for(let i=0;i<p.length;i+=4){let v=((p[i]-lo)*255/rg);v=v<0?0:v>255?255:v;p[i]=p[i+1]=p[i+2]=v}
  x.putImageData(id,0,0);return c;
}
function queueRead(d,p,text,force){
  return OCR.job(()=>readPhoto(d,p,text,force));
}
async function readPhoto(d,p,text,force){
  try{
    ocrMsg('증빙을 읽는 중…');
    if(!text)text=await OCR.read(await ocrPrep(p.data));
    applyRead(d,p,parseReceipt(text),force);
  }catch(e){
    console.error(e);
    ocrMsg('자동 인식을 쓸 수 없습니다: '+(e.message||e)+' — 날짜·금액·거래처는 직접 입력해 주세요. (회사망에서 cdn.jsdelivr.net 접속이 막혀 있으면 인식이 되지 않습니다)','bad');
  }
}
function applyRead(d,p,r,force){
  if(!r.amount&&!r.date){ocrMsg('이 증빙에서 날짜·금액·거래처를 찾지 못했습니다. 직접 입력해 주세요.','bad');return}
  let it=d.items.find(i=>i.pid===p.id);
  if(!it){it=d.items.find(i=>!(i.memo||num(i.amt)||i.vendor));if(!it){it={acct:'',memo:'',amt:'',vendor:'',fund:''};d.items.push(it)}}
  it.pid=p.id;
  if(r.memo&&(force||!it.memo))it.memo=r.memo;
  if(r.amount&&(force||!num(it.amt)))it.amt=r.amount;
  if(r.vendor&&(force||!it.vendor))it.vendor=r.vendor;
  if(r.date&&!d.dateOcr){
    d.dateOcr=true;d.date=r.date;if(!S.saved)d.year=r.date.slice(0,4);
    ['balui','gyeoljae','chulnap','deunggi'].forEach(k=>d.d[k]=r.date);
    if(d.autoNo)d.no=autoNo(r.date,d.id);
  }
  autoClassify(d);
  if(!it.acct&&d.mok)it.acct=d.mok;
  const n=d.items.indexOf(it)+1;
  if(cur===d){
    renderItems();renderGwa();
    const set=(k,v)=>{const e=document.querySelector('[data-k="'+k+'"]');if(e)e.value=v};
    set('date',d.date);set('no',d.no);set('year',d.year);['balui','gyeoljae','chulnap','deunggi'].forEach(k=>set('d.'+k,d.d[k]));
    const t=$('#ttl');if(t)t.textContent=d.no;
    touch();refreshPv();
  }else Store.save(d);
  ocrMsg('✔ 읽은 결과: '+(r.date||'날짜 없음')+' · '+(r.amount?fmt(r.amount)+'원':'금액 없음')+' · '+(r.vendor||'거래처 없음')+' → 지출 내역 '+n+'번 줄에 넣었습니다. 틀린 곳은 직접 고쳐 주세요.','ok');
}
async function pdfToPhotos(file,d){
  if(!window.pdfjsLib){await OCR.script(OCR.PDF)}
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=OCR.PDFW;
  const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];let text='';
  for(let n=1;n<=Math.min(doc.numPages,3);n++){
    const pg=await doc.getPage(n);
    const tc=await pg.getTextContent();
    let lastY=null,line='';
    let lastX=null;
    for(const it of tc.items){const y=it.transform[5],x=it.transform[4];
      if(lastY!==null&&Math.abs(y-lastY)>3){text+=line+'\n';line='';lastX=null}
      if(lastX!==null&&x-lastX>(it.height||10)*0.25)line+=' ';
      line+=it.str;lastY=y;lastX=x+(it.width||0)}
    text+=line+'\n';
    const vp=pg.getViewport({scale:1.8});
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:x,viewport:vp}).promise;
    out.push({id:uid(),data:encodeFit(c),cap:''});
  }
  return {photos:out,text:text.replace(/[ \t]+\n/g,'\n').trim()};
}
async function addFiles(files,target){
  const d=target||cur;if(!d)return;let n=0;const noOcr=!!target;
  toast('사진 처리 중…',8000);
  for(const f of files){
    const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name||'');
    if(!isPdf&&!f.type.startsWith('image/'))continue;
    await Folder.add(d,f);
    if(d.photos.length>=MAX_PHOTOS){toast('사진은 결의서 1건에 최대 '+MAX_PHOTOS+'장까지 넣을 수 있습니다');break}
    try{
      if(isPdf){
        const r=await pdfToPhotos(f,d);let first=true;const sh={};
        for(const p of r.photos){if(d.photos.length>=MAX_PHOTOS)break;d.photos.push(p);Store.savePhoto(d,p,{file:f,shared:sh});n++;
          if(first&&S.autoOcr!==false&&!noOcr){first=false;const useText=r.text.replace(/\s/g,'').length>=30?r.text:null;queueRead(d,p,useText)}}
      }else{
        const p={id:uid(),data:await fileToDataURL(f),cap:''};d.photos.push(p);Store.savePhoto(d,p,{file:f});n++;
        if(S.autoOcr!==false&&!noOcr)queueRead(d,p);
      }
    }
    catch(e){console.error(e);toast('파일을 읽지 못했습니다: '+(e.message||e))}
  }
  if(n){if(target){toast(n+'장 추가했습니다');return n}if(cur===d){renderPhotos();refreshPv()}touch();toast(n+'장 추가했습니다')}
  return n;
}

async function openCamera(){
  if(!cur)return;const d=cur;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){$('#fileCam').click();return}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false})}
  catch(e){toast('카메라를 열 수 없어 기본 카메라로 전환합니다');$('#fileCam').click();return}
  const ov=document.createElement('div');ov.id='cam';
  ov.innerHTML='<video autoplay playsinline muted></video><div class="flash"></div><div class="bar"><span class="cnt" id="camN">0장 촬영</span><button id="shot" aria-label="촬영"></button><button id="camDone">완료</button></div>';
  document.body.appendChild(ov);
  const v=ov.querySelector('video');v.srcObject=stream;
  let n=0;
  const close=()=>{stream.getTracks().forEach(t=>t.stop());ov.remove();if(cur===d){renderPhotos();refreshPv()}touch();if(n)toast(n+'장 추가했습니다')};
  ov.querySelector('#camDone').onclick=close;
  ov.querySelector('#shot').onclick=()=>{
    if(!v.videoWidth)return;
    if(d.photos.length>=MAX_PHOTOS){toast('사진은 결의서 1건에 최대 '+MAX_PHOTOS+'장까지 넣을 수 있습니다');return}
    const s=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement('canvas');c.width=Math.round(v.videoWidth*s);c.height=Math.round(v.videoHeight*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(v,0,0,c.width,c.height);
    const p={id:uid(),data:encodeFit(c),cap:''};d.photos.push(p);n++;if(S.autoOcr!==false)queueRead(d,p);
    const fc=document.createElement('canvas');fc.width=v.videoWidth;fc.height=v.videoHeight;fc.getContext('2d').drawImage(v,0,0);
    fc.toBlob(async b=>{const f=new File([b],'camera_'+Date.now()+'.jpg',{type:'image/jpeg'});await Folder.add(d,f);Store.savePhoto(d,p,{file:f})},'image/jpeg',0.92);
    ov.querySelector('#camN').textContent=n+'장 촬영';
    const fl=ov.querySelector('.flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),60);
  };
}

async function printDocs(list){
  if(!list.length)return;
  if(cur)await flushSave();
  if(Store.cloud&&list.some(d=>(d.photos||[]).some(p=>!p.data)))toast('사진 불러오는 중…',10000);
  for(const d of list)await Store.hydrate(d);
  $('#printRoot').innerHTML=list.map(d=>pagesHTML(d)).join('');
  const imgs=[...document.querySelectorAll('#printRoot img')];
  await Promise.all(imgs.map(i=>i.decode?i.decode().catch(()=>{}):0));

}

function applySnapshot(arr){
  docs=arr.map(d=>(cur&&d.id===cur.id)?cur:d);resetBp();
  [...sel].forEach(id=>{if(!docs.some(d=>d.id===id))sel.delete(id)});
  if(pendingOpen&&docs.some(d=>d.id===pendingOpen)){const id=pendingOpen;pendingOpen=null;history.replaceState(null,'',location.pathname+location.search);openDoc(id).then(()=>{const c=$('#photoCard');if(c)c.scrollIntoView()});return}
  if(cur)return;                       // 편집 중에는 화면을 건드리지 않음
  if(view!=='list')return;             // 책자·장부 화면에서는 목록으로 되돌리지 않음
  const a=document.activeElement;
  if(a&&(a.id==='q'||(a.id&&a.id.indexOf('pf')===0)))return;
  renderList();
}
(async function init(){
  Folder.load();
  
  try{
    await Store.init(u=>{
      if(u){loadS();Store.loadProfile().then(()=>{Store.subscribe(applySnapshot,e=>{console.error(e);toast('데이터를 불러오지 못했습니다: '+(e.code||e.message),5000)})})}
      else{docs=[];sel.clear();loadS();renderLogin()}
    });
  }catch(e){
    console.error(e);
    $('#app').innerHTML='<div class="wrap"><div class="card"><h2>Firebase를 불러오지 못했습니다</h2><div class="err">'+esc(e.message||e)+'</div><p class="muted">네트워크에서 gstatic.com 접속이 막혀 있거나 설정값이 잘못되었을 수 있습니다.</p></div></div>';
    return;
  }
  if(!Store.cloud){docs=await DB.all();resetBp();renderList()}
})();
})();
</script>
